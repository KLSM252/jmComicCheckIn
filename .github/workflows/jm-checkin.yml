name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: default
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF

      - name: Run check-in
        id: checkin_step
        run: |
          SUCCESS=false
          for attempt in 1 2 3; do
            echo "=== 第 $attempt 次尝试 ==="
            # 注意这里加了 2>&1，强制把错误信息也抓取下来
            if python run.py --once 2>&1 | tee checkin_log.txt; then
              SUCCESS=true
              break
            fi
            echo "签到失败（第 ${attempt} 次尝试）"
            if [ "${attempt}" -lt 3 ]; then
              sleep 120
            fi
          done
          
          # 强制打印日志文件内容到 Actions 控制台，方便排查
          echo "=== Python 运行日志如下 ==="
          cat checkin_log.txt
          echo "==========================="
          
          # 抓取日志：只要包含关键词，就抓最后一行，并清理回车符
          EXTRACTED=$(grep -E -i "JCoin|签到|成功|失败|error|exception" checkin_log.txt | tail -n 1 | tr -d '\r')
          
          # 如果还是空，给一个单行的兜底提示，防止多行文本搞坏变量
          if [ -z "$EXTRACTED" ]; then
            EXTRACTED="未抓取到关键信息，请前往 Actions 查看详细日志。"
          fi
          
          # 存入环境变量
          echo "SIGN_RESULT=$EXTRACTED" >> $GITHUB_ENV
          
          if [ "$SUCCESS" = false ]; then
            echo "重试 3 次后仍然失败"
            exit 1
          fi

      - name: Send DingTalk Notification
        if: always()
        run: |
          MSG_CONTENT=$(cat <<EOF
          jmComic 每日签到任务已执行完毕。
          
          具体结果：
          ${SIGN_RESULT}
          
          (本条消息包含关键词: 签到)
          EOF
          )
          
          JSON_PAYLOAD=$(jq -n \
            --arg content "$MSG_CONTENT" \
            '{msgtype: "text", text: {content: $content}}')
            
          curl -s -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DINGTALK_WEBHOOK }}"
