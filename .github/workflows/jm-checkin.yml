name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: default
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF

      - name: Run check-in
        id: checkin_step
        run: |
          SUCCESS=false
          # 保留重试逻辑，同时将日志输出到文件
          for attempt in 1 2 3; do
            echo "=== 第 $attempt 次尝试 ==="
            # tee 命令将输出同时打印到控制台和写入 checkin_log.txt
            if python run.py --once | tee checkin_log.txt; then
              SUCCESS=true
              break
            fi
            echo "签到失败（第 ${attempt} 次尝试）"
            if [ "${attempt}" -lt 3 ]; then
              sleep 120
            fi
          done
          
          # 放宽提取条件，忽略大小写，只要包含 JCoin、签到、成功、失败、error 都抓取最后一行
          EXTRACTED=$(grep -E -i "JCoin|签到|成功|失败|error|exception" checkin_log.txt | tail -n 1)
          
          # 如果还是抓不到，就把最后 5 行日志作为结果发出来，方便排查
          if [ -z "$EXTRACTED" ]; then
            EXTRACTED=$(tail -n 5 checkin_log.txt)
          fi
          
          # 将提取到的结果存入环境变量，供后续步骤使用
          echo "SIGN_RESULT=$EXTRACTED" >> $GITHUB_ENV
          
          if [ "$SUCCESS" = false ]; then
            echo "重试 3 次后仍然失败"
            exit 1
          fi

      - name: Send DingTalk Notification
        if: always() # 无论签到成功还是失败都发送通知
        run: |
          # 修复换行符问题，使用多行字符串构建消息内容
          MSG_CONTENT=$(cat <<EOF
          jmComic 每日签到任务已执行完毕。
          
          具体结果：
          ${SIGN_RESULT}
          
          (本条消息包含关键词: 签到)
          EOF
          )
          
          # 使用 jq 构造安全的 JSON，防止特殊字符导致格式错误
          JSON_PAYLOAD=$(jq -n \
            --arg content "$MSG_CONTENT" \
            '{msgtype: "text", text: {content: $content}}')
            
          # 发送到钉钉
          curl -s -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DINGTALK_WEBHOOK }}"
