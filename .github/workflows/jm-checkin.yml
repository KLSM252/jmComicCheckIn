name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      JM_USERNAME2: ${{ secrets.JM_USERNAME2 }}
      JM_PASSWORD2: ${{ secrets.JM_PASSWORD2 }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: ""
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          EOF
          
          # 如果配置了第二个账号，则动态追加
          if [ -n "${JM_USERNAME2}" ]; then
            cat >> config.yml <<'EOF'
            - name: ""
              username: "${JM_USERNAME2}"
              password: "${JM_PASSWORD2}"
          EOF
          fi
          
          # 追加定时任务和通知配置
          cat >> config.yml <<'EOF'
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF

      - name: Run check-in
        id: checkin_step
        run: |
          SUCCESS=false
          for attempt in 1 2 3; do
            echo "=== 第 $attempt 次尝试 ==="
            if python run.py --once 2>&1 | tee checkin_log.txt; then
              SUCCESS=true
              break
            fi
            echo "签到失败（第 ${attempt} 次尝试）"
            if [ "${attempt}" -lt 3 ]; then
              sleep 120
            fi
          done
          
          # 多账号提取逻辑：抓取所有包含结果的行，去掉颜色代码和前缀
          EXTRACTED=$(grep -E -i "JCoin|签到|成功|失败|error|exception" checkin_log.txt | \
                      perl -pe 's/.*default:\s*//g' | \
                      perl -pe 's/\x1b\[[0-9;]*m//g' | \
                      tr -d '\r' | \
                      grep -v '^$')
          
          if [ -z "$EXTRACTED" ]; then
            EXTRACTED="未抓取到关键信息，请前往 Actions 查看详细日志。"
          fi
          
          # 写入多行环境变量（使用 heredoc 语法防止截断）
          echo "SIGN_RESULT<<EOF" >> $GITHUB_ENV
          echo "$EXTRACTED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          if [ "$SUCCESS" = false ]; then
            echo "重试 3 次后仍然失败"
            exit 1
          fi

      - name: Send DingTalk Notification
        if: always()
        run: |
          MSG_CONTENT=$(cat <<EOF
          jmComic 每日签到任务已执行完毕。
          
          具体结果：
          ${SIGN_RESULT}
          
          (本条消息包含关键词: 签到)
          EOF
          )
          
          JSON_PAYLOAD=$(jq -n \
            --arg content "$MSG_CONTENT" \
            '{msgtype: "text", text: {content: $content}}')
            
          curl -s -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DINGTALK_WEBHOOK }}"
