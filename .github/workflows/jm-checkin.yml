name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config
        run: |
          cat > config.yml <<'EOF'
          accounts:
            - name: ""
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF

      - name: Run check-in
        id: checkin_step
        run: |
          SUCCESS=false
          for attempt in 1 2 3; do
            echo "=== 第 $attempt 次尝试 ==="
            if python run.py --once 2>&1 | tee checkin_log.txt; then
              SUCCESS=true
              break
            fi
            echo "签到失败（第 ${attempt} 次尝试）"
            if [ "${attempt}" -lt 3 ]; then
              sleep 120
            fi
          done
          
          # 使用 perl 暴力剔除所有的 default 和冒号组合，不依赖常规 sed
          # 然后把前面乱码般的前缀清空，只留结果
          RAW_LINE=$(grep -E -i "JCoin|签到|成功|失败|error|exception" checkin_log.txt | tail -n 1)
          EXTRACTED=$(echo "$RAW_LINE" | perl -pe 's/.*default:\s*//g' | perl -pe 's/\x1b\[[0-9;]*m//g' | tr -d '\r')
          
          # 如果上面的提取失败（例如连 default 都没有），直接用冒号强行切割取后半段
          if [ -z "$EXTRACTED" ]; then
            EXTRACTED=$(echo "$RAW_LINE" | perl -pe 's/\x1b\[[0-9;]*m//g' | cut -d ':' -f 2- | tr -d '\r')
          fi

          if [ -z "$EXTRACTED" ]; then
            EXTRACTED="未抓取到关键信息，请前往 Actions 查看详细日志。"
          fi
          
          echo "SIGN_RESULT=$EXTRACTED" >> $GITHUB_ENV
          
          if [ "$SUCCESS" = false ]; then
            echo "重试 3 次后仍然失败"
            exit 1
          fi

      - name: Send DingTalk Notification
        if: always()
        run: |
          MSG_CONTENT=$(cat <<EOF
          jmComic 每日签到任务已执行完毕。
          
          具体结果：
          ${SIGN_RESULT}
          
          (本条消息包含关键词: 签到)
          EOF
          )
          
          JSON_PAYLOAD=$(jq -n \
            --arg content "$MSG_CONTENT" \
            '{msgtype: "text", text: {content: $content}}')
            
          curl -s -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DINGTALK_WEBHOOK }}"
