name: JM Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # UTC 0点，即北京时间早上 8 点

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      JM_USERNAME: ${{ secrets.JM_USERNAME }}
      JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
      JM_USERNAME2: ${{ secrets.JM_USERNAME2 }}
      JM_PASSWORD2: ${{ secrets.JM_PASSWORD2 }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      # 修复1：版本号改为官方支持的最新版
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ===== 运行账号 1 =====
      - name: Run check-in for Account 1
        run: |
          # 修复2：去掉 EOF 的单引号，允许变量注入；建议加上缩进对齐
          cat > config.yml <<EOF
          accounts:
            - name: ""
              username: "${JM_USERNAME}"
              password: "${JM_PASSWORD}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF
          
          echo "=== 账号 1 开始尝试 ==="
          python run.py --once 2>&1 | tee log1.txt
          exit 0

      # ===== 运行账号 2 (如果配置了的话) =====
      - name: Run check-in for Account 2
        if: env.JM_USERNAME2 != ''
        run: |
          # 同样去掉单引号
          cat > config.yml <<EOF
          accounts:
            - name: ""
              username: "${JM_USERNAME2}"
              password: "${JM_PASSWORD2}"
          schedule:
            time: "08:00"
            timezone: "Asia/Shanghai"
            run_on_start: true
          notify:
            - type: pushplus
              token: "${PUSHPLUS_TOKEN}"
          EOF
          
          echo "=== 账号 2 开始尝试 ==="
          python run.py --once 2>&1 | tee log2.txt
          exit 0

      # ===== 提取结果并发送通知 =====
      - name: Extract Results and Send DingTalk
        if: always()
        run: |
          # 清洗并提取账号1的结果
          RES1=$(grep -E -i "JCoin|签到|成功|失败|error|exception" log1.txt | grep -v "INFO" | perl -pe 's/.*default:\s*//g' | perl -pe 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | grep -v '^$')
          if [ -z "$RES1" ]; then RES1="账号1无结果或失败"; fi
          
          # 清洗并提取账号2的结果
          RES2=""
          if [ -f log2.txt ]; then
            RES2=$(grep -E -i "JCoin|签到|成功|失败|error|exception" log2.txt | grep -v "INFO" | perl -pe 's/.*default:\s*//g' | perl -pe 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | grep -v '^$')
            if [ -z "$RES2" ]; then RES2="账号2无结果或失败"; fi
          fi

          # 组合最终消息
          MSG_CONTENT=$(cat <<EOF
          jmComic 每日签到任务已执行完毕。
          
          具体结果：
          ${RES1}
          ${RES2}
          
          (本条消息包含关键词: 签到)
          EOF
          )
          
          JSON_PAYLOAD=$(jq -n \
            --arg content "$MSG_CONTENT" \
            '{msgtype: "text", text: {content: $content}}')
            
          curl -s -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "${{ secrets.DINGTALK_WEBHOOK }}"
